formatter: "markdown table"

version: ">= 0.19.0"

# Run the hook from the module directory so README.md lives next to the code.
output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

content: |-
  {{ .Requirements }}

  {{ .Providers }}

  {{ .Inputs }}

  {{ .Outputs }}

  {{ .Resources }}

sections:
  show:
    - requirements
    - providers
    - inputs
    - outputs
    - resources

sort:
  enabled: true
  by: name

settings:
  anchor: true
  default: true
  description: true
  required: true
  type: true
